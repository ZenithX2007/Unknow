bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.02
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 1.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.25
      movement_time_allowance: 8.0

    general_goal_checker:
      stateful: false
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 6.28

    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 90
      model_dt: 0.05
      batch_size: 1500
      iteration_count: 1
      temperature: 0.3
      gamma: 0.05
      vx_std: 0.20
      vy_std: 0.0
      wz_std: 0.06
      vx_max: 0.45
      vx_min: -0.25
      vy_max: 0.0
      wz_max: 0.12
      retry_attempt_limit: 3
      motion_model: Ackermann
      AckermannConstraints:
        min_turning_r: 4.5
      visualize: false
      reset_period: 1.0
      regenerate_noises: false
      prune_distance: 4.0
      transform_tolerance: 0.2
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics:
        - ConstraintCritic
        - ObstaclesCritic
        - GoalCritic
        - PathAlignCritic
        - PathFollowCritic
        - PreferForwardCritic
        - VelocityDeadbandCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 0.15
        critical_weight: 20.0
        consider_footprint: false
        collision_cost: 80.0
        collision_margin_distance: 0.05
        near_goal_distance: 0.5
        inflation_radius: 1.10
        cost_scaling_factor: 5.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 18.0
        max_path_occupancy_ratio: 0.01
        trajectory_point_step: 3
        threshold_to_consider: 0.8
        offset_from_furthest: 8
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        offset_from_furthest: 8
        threshold_to_consider: 1.2
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.8
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 30.0
        deadband_velocities: [0.03, 0.0, 0.02]

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 20.0
      publish_frequency: 20.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.05
      footprint: "[[2.05, 0.95], [2.05, -0.95], [-1.45, -0.95], [-1.45, 0.95]]"
      footprint_padding: 0.05
      track_unknown_space: false
      plugins: ["local_obstacle_layer", "inflation_layer"]

      local_obstacle_layer:
        plugin: costmap_intensity::ObstacleLayerIntensity
        enabled: true
        footprint_clearing_enabled: true
        max_obstacle_intensity: 2.0
        min_obstacle_intensity: 0.3
        observation_sources: pointcloud
        pointcloud:
          topic: /gen0_mapping/terrain_map
          observation_persistence: 0.2
          expected_update_rate: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -2.0
          obstacle_max_range: 7.0
          obstacle_min_range: 0.15
          raytrace_max_range: 8.0
          raytrace_min_range: 0.1
          clearing: false
          marking: true
          data_type: PointCloud2

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 1.10

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      resolution: 0.1
      track_unknown_space: true
      footprint: "[[2.05, 0.95], [2.05, -0.95], [-1.45, -0.95], [-1.45, 0.95]]"
      footprint_padding: 0.05
      plugins: ["static_layer", "global_inflation_layer"]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true

      global_inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 10.0
        inflation_radius: 1.10

      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: nav2_theta_star_planner/ThetaStarPlanner
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      w_heuristic_cost: 1.0

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["SmoothPath"]

    SmoothPath:
      plugin: nav2_constrained_smoother/ConstrainedSmoother
      reversing_enabled: false
      path_downsampling_factor: 3
      path_upsampling_factor: 1
      keep_start_orientation: false
      keep_goal_orientation: false
      minimum_turning_radius: 4.5
      w_curve: 30.0
      w_dist: 0.0
      w_smooth: 2000000.0
      w_cost: 100.0
      w_cost_cusp_multiplier: 3.0
      cusp_zone_length: 2.5
      optimizer:
        max_iterations: 70
        debug_optimizer: false
        gradient_tol: 5000.0
        fn_tol: 1.0e-15
        param_tol: 1.0e-20

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    backup:
      plugin: nav2_behaviors/BackUpTwzFree
      service_name: /local_costmap/get_costmap
      robot_radius: 0.8
      max_radius: 2.0
      free_threshold: 5
      cost_threshold: 5.0
      holonomic_motion: false
      max_angular_speed: 0.12
      visualization: false
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.12
    min_rotational_vel: 0.05
    rotational_acc_lim: 0.4

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 40.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.45, 0.0, 0.12]
    min_velocity: [-0.25, 0.0, -0.12]
    max_accel: [0.45, 0.0, 0.4]
    max_decel: [-0.70, 0.0, -0.4]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.02, 0.0, 0.01]
    velocity_timeout: 1.0
