cmd_vel_adapter:
  ros__parameters:
    input_topic: /cmd_vel
    output_topic: /control/cmd_vel
    max_linear_speed: 2.0
    max_angular_speed: 0.4
    min_linear_speed_for_rotation: 0.2
    linear_deadband: 0.02
    angular_deadband: 0.02
    command_timeout: 0.5
    publish_rate: 20.0

ground_truth_odometry:
  ros__parameters:
    pose_topic: /gen0_model/links/poses
    odom_topic: /odom
    pose_index: 15
    odom_frame: odom
    base_frame: base_footprint
    publish_tf: true
