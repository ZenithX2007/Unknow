name: gen0_gz_sim_ros2 main CI
on:
  push:
    branches: [ gen0_humble ]
jobs:
  docker-publish:
    name: Build & Push Docker Image
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT_TOKEN }}" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
      
      - name: Build and push Docker image
        run: |
          docker build -t ghcr.io/av-lab/gen0-gz-sim-ros2:latest -f docker/Dockerfile .
          docker push ghcr.io/av-lab/gen0-gz-sim-ros2:latest
